<!doctype html>
<html lang="sv" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Commit-staden</title>
  <meta name="description" content="Dina GitHub-repon som en levande stad">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Commit-staden">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Silkscreen&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      var t = localStorage.getItem('cs-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>

  <canvas id="stad" role="img" aria-label="Staden: varje distrikt är ett repo"></canvas>

  <header class="hud">
    <div class="hud-topp">
      <div class="hud-namn">
        <h1>Commit-staden</h1>
        <span id="hud-datum" class="hud-sub"></span>
      </div>
      <span id="demo-badge" class="badge">Demo</span>
    </div>
    <dl class="hud-siffror">
      <div><dt>Invånare</dt><dd id="hud-invanare" class="accent">–</dd></div>
      <div><dt>Budget</dt><dd id="hud-budget">–</dd></div>
      <div><dt>Nöjdhet</dt><dd id="hud-nojdhet">–</dd></div>
      <div><dt>Bränder</dt><dd id="hud-brander">–</dd></div>
    </dl>
  </header>

  <ul id="distrikt-lista" class="sr-only" aria-label="Distrikt i staden"></ul>

  <button id="ticker" class="ticker" type="button" hidden>
    <span class="ticker-prick" aria-hidden="true"></span>
    <span id="ticker-text"></span>
  </button>

  <nav class="verktyg" aria-label="Verktyg">
    <button class="verktyg-knapp" id="btn-centrera" type="button">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/><circle cx="12" cy="12" r="2.5"/></svg>
      Centrera
    </button>
    <button class="verktyg-knapp" id="btn-theme" type="button" aria-label="Byt tema">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <span id="theme-label">Auto</span>
    </button>
  </nav>

  <section id="kort" class="kort" role="dialog" aria-labelledby="kort-titel" hidden>
    <div class="kort-handtag" aria-hidden="true"></div>
    <div class="kort-topp">
      <div>
        <p id="kort-zon" class="kort-zon"></p>
        <h2 id="kort-titel"></h2>
      </div>
      <button class="rund-knapp" id="btn-stang" type="button" aria-label="Stäng">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <dl id="kort-siffror" class="kort-siffror"></dl>
    <p id="kort-status" class="kort-status"></p>
  </section>

  <script src="demo.js"></script>
  <script src="stad.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(function () {});
      var laddad = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (laddad) return;
        laddad = true;
        location.reload();
      });
    }
  </script>
</body>
</html>
